<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Archipelago — an open-source Enterprise Architecture repository that runs entirely in your browser. ArchiMate 3.2-native, local-first."
    />
    <title>Archipelago</title>
    <script>
      // Theme is applied before first paint so the shell never flashes the wrong palette.
      // Mirrors readStoredTheme() in src/app/theme.ts — keep the storage key in sync.
      ;(function () {
        try {
          var stored = localStorage.getItem('archipelago.theme')
          var theme =
            stored === 'light' || stored === 'dark'
              ? stored
              : window.matchMedia('(prefers-color-scheme: dark)').matches
                ? 'dark'
                : 'light'
          document.documentElement.setAttribute('data-theme', theme)
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'light')
        }
      })()
    </script>
    <script>
      // Single-page-app redirect for GitHub Pages: 404.html rewrites a deep link into
      // /?/path&query, and this restores it before React Router boots.
      // https://github.com/rafgraph/spa-github-pages
      ;(function (l) {
        if (l.search[1] === '/') {
          var decoded = l.search
            .slice(1)
            .split('&')
            .map(function (s) {
              return s.replace(/~and~/g, '&')
            })
            .join('?')
          window.history.replaceState(null, '', l.pathname.slice(0, -1) + decoded + l.hash)
        }
      })(window.location)
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
